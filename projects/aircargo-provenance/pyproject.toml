[tool.poetry]
name = "aircargo-provenance"
version = "0.1.0"
description = "Algorand smart contracts"
authors = ["Sambhav Verma <vermasambhav8@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
algokit-utils = "^4.0.0"
python-dotenv = "^1.0.0"
algorand-python = ">=4.0.0,<4.1.0"
fastapi = "^0.143.1"
uvicorn = "^0.54.0"

[tool.poetry.group.dev.dependencies]
algokit-client-generator = "^2.1.0"
puyapy = "*"
pytest = "^9.1.1"
algorand-python-testing = "^1.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
